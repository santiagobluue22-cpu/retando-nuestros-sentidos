<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive, noimageindex">
  <title>Panel del equipo</title>
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    :root { --s1: #2a78d6; --s2: #eb6834; }
    main { max-width: 1000px; }
    .fuentes { display: flex; flex-wrap: wrap; gap: 8px; }
    .fuentes .btn { width: auto; flex: 1 1 200px; margin: 0; }
    .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }
    .kpi { background: var(--superficie); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; }
    .kpi .v { font-size: 1.6rem; font-weight: 800; }
    .kpi .l { font-size: .8rem; color: var(--suave); }
    .leyenda-s { display: flex; gap: 16px; font-size: .85rem; color: var(--suave); margin: 4px 0 8px; }
    .leyenda-s i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
    .grupo { margin: 10px 0 14px; }
    .grupo .t { font-weight: 700; font-size: .9rem; margin-bottom: 4px; }
    .barra-h { display: flex; align-items: center; gap: 8px; margin: 2px 0; }
    .barra-h .pista { flex: 1; height: 18px; position: relative; }
    .barra-h .relleno { height: 100%; border-radius: 0 4px 4px 0; min-width: 2px; }
    .barra-h .val { width: 92px; font-size: .82rem; color: var(--texto); font-variant-numeric: tabular-nums; }
    .barra-h .ser { width: 76px; font-size: .78rem; color: var(--suave); }
    table.datos { width: 100%; border-collapse: collapse; font-size: .85rem; }
    table.datos th, table.datos td { border-bottom: 1px solid var(--borde); padding: 6px 5px; text-align: center; font-variant-numeric: tabular-nums; }
    table.datos th:first-child, table.datos td:first-child { text-align: left; }
    table.datos th { color: var(--suave); font-weight: 600; }
    table.datos td:first-child { min-width: 64px; }
    .scroll { overflow-x: auto; }
    .rejilla { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
    .mapa { position: relative; line-height: 0; background: #111; border-radius: 8px; overflow: hidden; }
    .mapa img { width: 100%; display: block; opacity: .75; }
    .mapa canvas { position: absolute; inset: 0; width: 100%; height: 100%; }
    .hist { display: flex; align-items: flex-end; gap: 2px; height: 110px; border-bottom: 1px solid var(--borde); position: relative; }
    .hist div.b { flex: 1; background: var(--s1); border-radius: 4px 4px 0 0; min-height: 1px; }
    .hist div.b.clave { background: var(--s2); }
    .hist-ejes { display: flex; justify-content: space-between; font-size: .75rem; color: var(--suave); }
    .tip { position: fixed; pointer-events: none; background: #1d1f21; color: #fff; padding: 6px 9px; border-radius: 6px; font-size: .8rem; z-index: 200; display: none; max-width: 240px; }
    nav.secciones { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    nav.secciones a { font-size: .85rem; padding: 4px 10px; border: 1px solid var(--borde); border-radius: 999px; text-decoration: none; color: var(--texto); background: var(--superficie); }
    .previa .lienzo-img { padding: 4px; }
  </style>
</head>
<body>
  <header class="barra"><span class="marca">Panel del equipo · Retando nuestros sentidos</span><span class="progreso" id="estado"></span></header>
  <main id="panel">
    <div class="tarjeta" id="acceso" style="max-width:420px;margin:40px auto">
      <h2>Acceso</h2>
      <p class="suave">Escribe la clave del panel (definida en <code>config.js</code>).</p>
      <input type="password" id="clave" autocomplete="off">
      <button class="btn primario" id="entrar">Entrar</button>
      <p class="aviso error oculto" id="err">Clave incorrecta.</p>
    </div>
    <div id="contenido" class="oculto"></div>
  </main>
  <div class="tip" id="tip"></div>
  <script src="config.js"></script>
  <script src="js/datos.js"></script>
  <script src="js/panel.js"></script>
</body>
</html>
